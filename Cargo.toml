[package]
name = "tpsearch"
version = "0.1.0"
edition = "2021"
description = "Local-first desktop and drive search: collections, full-text passages, provenance"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
globset = "0.4"
dunce = "1"
toml = "0.8"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
dunce = "1"
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
