[package]
name = "tpsearch"
version = "0.1.0"
edition = "2021"
description = "A local search engine for structured Theophysics markdown documents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
walkdir = "2"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
open = "5"
pdf-extract = "0.7"
quick-xml = "0.36"
scraper = "0.20"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
zip = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
