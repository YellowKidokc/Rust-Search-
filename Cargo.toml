[package]
name = "tpsearch"
version = "0.1.0"
edition = "2021"
description = "Local-first desktop and drive search: collections, full-text passages, provenance"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
walkdir = "2"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
open = "5"
pdf-extract = "0.7"
quick-xml = "0.36"
scraper = "0.20"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
zip = "2"

# Existing collection implementation prerequisites (missing from the merged manifest).
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
globset = "0.4"
dunce = "1"
toml = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
