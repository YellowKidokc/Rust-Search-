<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>tpsearch</title><style>
:root{color-scheme:dark;--bg:#18181b;--panel:#24242a;--line:#393941;--text:#ddd;--muted:#999;--accent:#9b87f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;font-size:22px;font-weight:700;border-bottom:1px solid var(--line)}.controls{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}input,select,button{background:#303038;color:var(--text);border:1px solid #4b4b55;border-radius:5px;padding:9px}#search{flex:1;min-width:240px}button{cursor:pointer}button.primary{background:var(--accent);color:#111;font-weight:bold}.status{margin-left:auto;color:var(--muted)}#results{margin:14px 0;max-height:58vh;overflow:auto}.result{display:grid;grid-template-columns:28px 1fr;border-bottom:1px solid var(--line);padding:14px 5px}.title{font-size:17px;font-weight:650;cursor:pointer}.meta,.snippet,.details{color:var(--muted);margin-top:5px}.path,.score{font-family:monospace}.green{color:#56d364}.yellow{color:#e3b341}.red{color:#f85149}.details{display:none;white-space:pre-wrap}.open .details{display:block}@media(max-width:650px){header,main,footer{padding:10px}.row>*{flex:1}}
</style></head><body><header><span>tpsearch</span><select id="saved"><option>Saved searches</option></select></header><main><section class="controls"><div class="row"><input id="search" placeholder="Search research…"><button id="go" class="primary">Search</button><button id="save">Save</button></div><div class="row"><input id="domain" placeholder="Domain"><input id="series" placeholder="Series"><input id="score" type="number" placeholder="Min score"><input id="s07" type="number" placeholder="S07 min"><input id="s08" type="number" placeholder="S08 min"><label><input id="counter" type="checkbox"> Has counter</label><select id="sort"><option value="score">Score</option><option value="title">Title</option><option value="modified">Modified</option></select><span id="status" class="status">Ready</span></div></section><div id="results"></div></main><footer><button id="all">Select All</button> <button data-export="files">Export Files</button> <button data-export="csv">Export CSV</button> <button data-export="snippets">Export Snippets</button> <button data-export="manifest">Export Manifest</button></footer><script>
let results=[],lastQuery={sort:'score',limit:100};const $=id=>document.getElementById(id);function params(){let p=new URLSearchParams(),q={sort:$('sort').value,limit:100};for(let [id,key] of [['search','search'],['domain','domain'],['series','series'],['score','min_score'],['s07','min_s07'],['s08','min_s08']])if($(id).value){p.set(key,$(id).value);q[key]=$(id).value}if($('counter').checked){p.set('has_counter','true');q.has_counter=true}p.set('sort',q.sort);p.set('limit','100');lastQuery={...q,min_sections:[null,null,null,null,null,null,q.min_s07?+q.min_s07:null,q.min_s08?+q.min_s08:null,null,null]};return p}async function search(){ $('status').textContent='Searching…';results=await fetch('/api/query?'+params()).then(r=>r.json());$('status').textContent=results.length+' found';$('results').innerHTML=results.map((x,i)=>{let r=x.record,s=r.score_total??'-',c=s>=75?'green':s>=60?'yellow':'red';return `<article class="result"><input type="checkbox" data-i="${i}"><div><div class="title"><span class="score ${c}">[${s}]</span> ${esc(r.title||r.clean_title||'Untitled')}</div><div class="meta">${esc(r.domain_primary||'')} | ${esc(r.series||'')} | <span class="path">${esc(r.file_path)}</span></div><div class="snippet">${esc(x.snippet||r.one_sentence_finding||'')}</div><div class="details">${esc([r.one_sentence_finding,r.evd_weakest_claim,r.build_next].filter(Boolean).join('\n\n'))}</div></div></article>`}).join('');document.querySelectorAll('.title').forEach(x=>x.onclick=()=>x.closest('.result').classList.toggle('open'))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function selected(){return [...document.querySelectorAll('[data-i]:checked')].map(x=>results[+x.dataset.i])}function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}$('go').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('all').onclick=()=>document.querySelectorAll('[data-i]').forEach(x=>x.checked=true);$('save').onclick=async()=>{let n=prompt('Saved search name');if(n)await fetch('/api/saved/'+encodeURIComponent(n),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:lastQuery,results})})};document.querySelectorAll('[data-export]').forEach(b=>b.onclick=async()=>{let kind=b.dataset.export,s=selected();if(!s.length)return alert('Select results first');let body=kind==='files'?{file_paths:s.map(x=>x.record.file_path),target:prompt('Target folder path')}:kind==='snippets'?{results:s,query:lastQuery}:s;let r=await fetch('/api/export/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(kind!=='files')dl(await r.blob(),'tpsearch-'+kind+(kind==='snippets'?'.md':kind==='manifest'?'.json':'.csv'))});fetch('/api/saved').then(r=>r.json()).then(ns=>ns.forEach(n=>$('saved').add(new Option(n,n))));$('saved').onchange=async()=>{let s=await fetch('/api/saved/'+encodeURIComponent($('saved').value)).then(r=>r.json());for(let k of ['search','domain','series'])$(k).value=s.query[k]||'';search()};search();
</script></body></html>
