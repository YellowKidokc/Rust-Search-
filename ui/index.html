<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tpsearch — Research search</title>
<style>:root{color-scheme:dark;--bg:#18181b;--panel:#24242a;--line:#393941;--text:#eee;--muted:#b5b5bf;--accent:#b6a5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:20px}header{border-bottom:1px solid var(--line)}h1{margin:0 0 6px}p{color:var(--muted);line-height:1.5}.controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}label{display:flex;flex-direction:column;gap:6px;font-size:14px}label.grow{flex:1}input,select,button{font:inherit;background:#303038;color:var(--text);border:1px solid #656572;border-radius:6px;padding:10px}input:focus,select:focus,button:focus{outline:2px solid var(--accent);outline-offset:2px}button{cursor:pointer}button.primary{background:var(--accent);color:#111;font-weight:700}#q{min-width:230px}.check{flex-direction:row;align-items:center}.status{color:var(--muted)}article{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}h2{font-size:18px;margin:0}.path{font:13px monospace;overflow-wrap:anywhere;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.6 system-ui}.meta{color:var(--muted);font-size:14px}.error{color:#ffb3b3}.tools{display:flex;gap:10px;flex-wrap:wrap}details{margin:12px 0}summary{cursor:pointer}small{color:var(--muted)}@media(max-width:650px){header,main,footer{padding:12px}.row>label{width:100%}}</style>
</head><body><header><h1>tpsearch</h1><small>Your research, with the source passage attached.</small></header>
<main><form id="form" class="controls"><div class="row"><label class="grow">Search<input id="q" required placeholder='"minimal facts" resurrection'></label><label>Collection<select id="collection"></select></label><button class="primary" type="submit" id="go">Search</button></div>
<details><summary>Filters</summary><div class="row"><label>File types<input id="type" placeholder="md,json"></label><label class="grow">Path contains<input id="path" placeholder="Gary Habermas"></label><label>Representation<select id="representation"><option value="">Any</option><option>original</option><option>transcript</option><option>derived</option><option>copy</option></select></label></div><div class="row"><label class="grow">Existing metadata<input id="meta" placeholder="domain=Theology"></label><label>Modified after<input id="after" type="date"></label><label>Before<input id="before" type="date"></label><label>Results<input id="limit" type="number" min="1" max="200" value="30"></label></div><div class="row"><label class="check"><input id="phrase" type="checkbox">Exact phrase</label><label class="check"><input id="any" type="checkbox">Match any term</label></div></details>
<div class="row"><button type="button" id="save">Save search</button><label>Saved searches<select id="saved"><option value="">Choose…</option></select></label></div><p id="status" role="status" aria-live="polite">Loading collections…</p></form>
<p>Filters use metadata already present in your files. Search rank measures text relevance; it does not grade the argument or classify it.</p><div id="results"></div></main>
<footer class="tools"><button id="all">Select all</button><button data-export="md">Export passages</button><button data-export="csv">Export CSV</button><button data-export="json">Export JSON</button></footer>
<script>
'use strict';const $=id=>document.getElementById(id), fields=['q','collection','type','path','representation','meta','after','before','limit','phrase','any'];let hits=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function values(){let v={};for(const k of fields)v[k]=$(k).type==='checkbox'?String($(k).checked):$(k).value;return v}
function saved(){try{return JSON.parse(localStorage.getItem('tpsearch.saved')||'{}')}catch{return {}}}
function refreshSaved(){const s=saved();$('saved').replaceChildren(new Option('Choose…',''));for(const key of Object.keys(s))$('saved').add(new Option(key,key))}
async function run(event){event?.preventDefault();$('go').disabled=true;$('status').className='status';$('status').textContent='Searching…';try{const r=await fetch('/api/search?'+new URLSearchParams(values())),d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');hits=d.hits||[];$('status').textContent=`${d.matching_passages} passages in ${d.matching_files} files · ${d.independent_sources} independent sources · showing ${hits.length}`;$('results').innerHTML=hits.map((h,i)=>{const l=h.location||{};return `<article><label class="check"><input type="checkbox" data-i="${i}"><h2>${esc(h.rel_path||h.path)}</h2></label><p class="path">${esc(h.path)}</p><div class="meta">${esc(h.collection)} · ${esc(h.representation)} · ${esc(l.kind)} ${esc(l.start)}–${esc(l.end)}${l.t_start?' · '+esc(l.t_start):''} · Quote: ${esc(h.quote_check)}${h.root_offline?' · SOURCE OFFLINE':''}</div><pre>${esc(h.text)}</pre><details><summary>Context and provenance</summary><pre>${esc(h.context_before)}\n\n${esc(h.text)}\n\n${esc(h.context_after)}</pre><div class="meta">Matched in ${esc(h.matched_in)} · ${esc(l.section)}<br>SHA-256: ${esc(h.source_sha256)}<br>${h.copies?.length||0} identical copies collapsed</div></details></article>`}).join('')||'<p>No matching passages. Try fewer words or another collection.</p>'}catch(e){hits=[];$('results').replaceChildren();$('status').className='error';$('status').textContent=e.message}finally{$('go').disabled=false}}
$('form').onsubmit=run;$('save').onclick=()=>{const name=prompt('Name this search');if(!name)return;const s=saved();Object.defineProperty(s,name,{value:values(),enumerable:true,configurable:true,writable:true});try{localStorage.setItem('tpsearch.saved',JSON.stringify(s));refreshSaved()}catch(e){$('status').textContent='Could not save in this browser: '+e.message}};$('saved').onchange=()=>{const v=saved()[$('saved').value];if(!v)return;for(const k of fields)if(v[k]!==undefined){if($(k).type==='checkbox')$(k).checked=v[k]==='true';else $(k).value=v[k]}run()};$('all').onclick=()=>document.querySelectorAll('[data-i]').forEach(e=>e.checked=true);
document.querySelectorAll('[data-export]').forEach(button=>button.onclick=()=>{const selected=[...document.querySelectorAll('[data-i]:checked')].map(e=>hits[+e.dataset.i]);if(!selected.length){$('status').textContent='Select passages to export first.';return}const kind=button.dataset.export;let text;if(kind==='json')text=JSON.stringify(selected,null,2);else if(kind==='md')text=selected.map(h=>`## ${h.rel_path}\n\nSource: ${h.path}\nLocation: ${h.location.kind} ${h.location.start}-${h.location.end}\nQuote check: ${h.quote_check}\n\n${h.text}`).join('\n\n---\n\n');else{const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';text=['path,collection,location,quote_check,text',...selected.map(h=>[h.path,h.collection,`${h.location.kind} ${h.location.start}-${h.location.end}`,h.quote_check,h.text].map(cell).join(','))].join('\r\n')}const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='tpsearch-results.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
fetch('/api/collections').then(r=>r.json()).then(d=>{for(const n of d.collections)$('collection').add(new Option(n,n));$('status').textContent=d.collections.length?'Ready. Enter a query.':'No collections configured. Run the hub intake/index step or create a tpsearch collection. Config: '+d.config;refreshSaved()}).catch(e=>$('status').textContent=e.message);
</script></body></html>
